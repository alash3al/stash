# =============================================================================
# Stash — Docker Compose
# =============================================================================
# All configuration is sourced from .env (the single source of truth).
# Copy .env.example to .env before running: cp .env.example .env
# Start: docker compose up -d
# Stop:  docker compose down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB:       stash
      POSTGRES_USER:     stash
      POSTGRES_PASSWORD: stash_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stash_net
    restart: unless-stopped
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U stash -d stash"]
      interval: 10s
      timeout:  5s
      retries:  5
    # Uncomment to expose postgres to host tools (pgAdmin, DBeaver, etc.):
    # ports:
    #   - "5432:5432"

  # ---------------------------------------------------------------------------
  # Stash — MCP server + background consolidation
  # ---------------------------------------------------------------------------
  stash:
    build: .
    command: ["mcp", "serve", "--host", "0.0.0.0", "--port", "8080", "--with-consolidation"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override DSN to use the Docker service name (not localhost).
      # All other vars are sourced from .env via env_file above.
      STASH_POSTGRES_DSN: postgres://stash:stash_dev_password@postgres:5432/stash?sslmode=disable
    networks:
      - stash_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:     ["CMD", "/stash", "env"]
      interval: 30s
      timeout:  10s
      retries:  3

# =============================================================================
# Volumes & Networks
# =============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  stash_net:
    driver: bridge