name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stash
          POSTGRES_PASSWORD: stash
          POSTGRES_DB: stash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Test
        env:
          STASH_TEST_DSN: postgresql://stash:stash@localhost:5432/stash?sslmode=disable
        run: go test ./...